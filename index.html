<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noimageindex, noarchive, nosnippet">
<meta name="bingbot" content="noindex, nofollow, noimageindex, noarchive, nosnippet">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Maha Alsubaie, Beauty Product Developer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Playfair+Display:ital,wght@1,700;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBE4E5}
*{box-sizing:border-box}
a{color:#B0252C;text-decoration:none}a:hover{color:#8E1C22}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid #B0252C;outline-offset:3px;border-radius:6px}
.s{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:800}
.nav a:hover{text-decoration:underline;text-underline-offset:4px}
.lift{transition:transform .25s ease,box-shadow .25s ease}
.lift:hover{transform:translateY(-3px);box-shadow:0 18px 30px -22px rgba(196,45,50,.6)}
.zoom{transition:transform .4s ease}
.lift:hover .zoom{transform:scale(1.04)}
.obtn{transition:background .2s,color .2s}
.obtn:hover{background:#D1323A!important;color:#FFFFFF!important}
.sbtn{transition:background .2s}
.sbtn:hover{background:#B0252C!important}
.wbtn:hover{background:#FCEDEE!important}
.chip{transition:background .2s,color .2s}
.chip:hover{background:#D1323A!important;color:#FFFFFF!important}
.thumb:hover{opacity:.95!important}
.fade{animation:fade .35s ease both}
.gbtn{display:block;width:100%;padding:0;border:0;background:none;border-radius:8px;overflow:hidden;cursor:zoom-in}
.gbtn img{transition:transform .4s ease}
.gbtn:hover img{transform:scale(1.05)}
.lbx{position:fixed;inset:0;z-index:50;background:rgba(58,35,38,.92);display:flex;align-items:center;justify-content:center;padding:24px}
.lbnav{width:52px;height:52px;border-radius:50%;border:0;background:#FFFFFF;color:#B0252C;display:grid;place-items:center;flex-shrink:0}
.lbnav:hover{background:#FCEDEE}
@keyframes reveal{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: no-preference){@supports (animation-timeline: view()){.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 30%}}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.hero{display:grid;grid-template-columns:1fr;gap:6px;min-height:520px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum .wide{grid-column:1 / -1}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.about{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:start}
.xrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px}
.certs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.skrow{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:center}
.vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.vlist{display:flex;flex-direction:column;gap:12px}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.vv-tall{width:260px}
.vv-wide{width:560px}
.skl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px}
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mnav{display:none}
@container page (max-width: 1080px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .viewer{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .about{grid-template-columns:1fr}
  .certs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
  .vv-wide{width:440px}
  .skl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wordmark{font-size:76px!important}
}
@container page (max-width: 760px){
  .hero{grid-template-columns:1fr;min-height:0}
  .portrait{aspect-ratio:4 / 4.4!important;order:2;min-height:0!important}
  .hero-panel{order:3;padding:22px 18px 20px!important}
  .dnav{display:none!important}
  .mnav{display:flex}
  .wordmark{font-size:52px!important}
  .cards,.sum,.steps,.certs,.vids,.contact{grid-template-columns:1fr}
  .photos,.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vrow{grid-template-columns:1fr;gap:14px}
  .vv-tall{width:100%;max-width:280px}
  .vv-wide{width:100%}
  .skl{grid-template-columns:1fr}
  .lbx{padding:12px}
  .lbnav{width:44px;height:44px}
  .skrow{grid-template-columns:1fr;gap:6px}
  .xrow{grid-template-columns:1fr;gap:4px}
  .shead{flex-direction:column;align-items:flex-start!important}
  .shead p{text-align:left!important}
  .stage{height:auto!important;min-height:240px;padding:44px 10px 56px!important}
  .stage img{max-height:380px!important}
  .arrow{top:auto!important;bottom:10px!important;transform:none!important}
  .arrow.prev{left:auto!important;right:62px!important}
  .frame{padding:8px!important;border-radius:16px!important}
  .pagepad{padding:10px!important}
  .tight{padding:22px 16px!important}
  .h2{font-size:28px!important}
  .cs-title{font-size:30px!important}
}
</style>

<style>.reveal:has(.lbx){animation:none!important;transform:none!important}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="pagepad" style="container-type: inline-size; container-name: page; background: #FBE4E5; padding: 28px; font-family: 'DM Sans', system-ui, sans-serif; color: #3A2326; line-height: 1.5">
<div class="frame" style="max-width: 1240px; margin: 0 auto; background: #FFFFFF; border-radius: 22px; padding: 14px; box-shadow: 0 0 0 5px #F4C9CB">


<header id="top" class="hero" style="background: #D1323A; border-radius: 22px; padding: 6px">
  <nav class="mnav" aria-label="Main" style="justify-content: center; gap: 6px; flex-wrap: wrap; background: #FFFFFF; border-radius: 14px; padding: 10px; order: 1">
    <a href="#work" style="background: #FCEDEE; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600">Work</a>
    <a href="#videos" style="background: #FCEDEE; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600">Videos</a>
    <a href="#photos" style="background: #FCEDEE; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600">Photos</a>
    <a href="#approach" style="background: #FCEDEE; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600">Approach</a>
    <a href="#about" style="background: #FCEDEE; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600">About</a>
    <a href="#credentials" style="background: #FCEDEE; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600">Credentials</a>
    <a href="#contact" style="background: #D1323A; color: #FFFFFF; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600">Contact</a>
  </nav>
  <div class="hero-panel" style="background: #FCEDEE; border-radius: 16px; display: flex; flex-direction: column; padding: 22px 38px 28px">
    <nav class="dnav nav" aria-label="Main" style="display: flex; justify-content: flex-end; align-items: center; gap: 24px; font-size: 13px; font-weight: 500">
      <a href="#work">Work</a><a href="#videos">Videos</a><a href="#photos">Photos</a><a href="#approach">Approach</a><a href="#about">About</a><a href="#credentials">Credentials</a>
      <a class="obtn" href="#contact" style="border: 1.5px solid #D1323A; border-radius: 999px; padding: 6px 16px; font-weight: 600; color: #B0252C">Contact</a>
    </nav>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 16px; padding: 26px 0 8px">
      <h1 class="wordmark" style="margin: 0; font-weight: 800; letter-spacing: -0.055em; line-height: 0.9; font-size: 96px; color: #D1323A">Maha<br>Alsubaie</h1>
      <p class="s" style="margin: 4px 0 0; font-size: 26px; line-height: 1.15; color: #B0252C">Beauty Product Developer</p>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px">
        <a class="sbtn" href="#work" style="display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 26px; border-radius: 10px; background: #D1323A; color: #FFFFFF; font-size: 14px; font-weight: 600">View My Work</a>
        <a class="obtn" href="#contact" style="display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 26px; border-radius: 10px; border: 1.5px solid #D1323A; color: #B0252C; font-size: 14px; font-weight: 600">Get in Touch</a>
      </div>
      <p style="margin: 10px 0 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #7A5A5E">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 13s4.5-4.2 4.5-7.4A4.5 4.5 0 0 0 2.5 5.6C2.5 8.8 7 13 7 13z" fill="none" stroke="currentColor" stroke-width="1.5"></path><circle cx="7" cy="5.7" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"></circle></svg>
        PMP® Certified · Al Khobar, Saudi Arabia · Open to relocation
      </p>
    </div>
  </div>
</header>


<section id="work" ref="{{ workRef }}" style="padding-top: 60px; scroll-margin-top: 16px" aria-labelledby="work-h">
  <div class="shead" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 22px">
    <div>
      <span style="display: inline-block; border: 1.5px solid #D1323A; border-radius: 999px; padding: 4px 12px; font-size: 11.5px; font-weight: 600; color: #B0252C">01  Selected Projects</span>
      <h2 id="work-h" class="h2" style="margin: 10px 0 0; font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: #D1323A">Selected <span class="s">Projects</span></h2>
      <p style="margin: 8px 0 0; font-size: 14px; font-weight: 500; color: #3A2326">I developed each of these projects independently.</p>
    </div>
    <p style="margin: 0; font-size: 13px; max-width: 380px; text-align: right; line-height: 1.5; color: #7A5A5E">Each case study opens with a short summary. The full deck sits underneath it.</p>
  </div>

  <sc-if value="{{ gridVisible }}" hint-placeholder-val="{{ true }}">
    <div class="cards fade">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
        <article class="lift" style="display: flex; flex-direction: column; border-radius: 14px; background: #F7F4F4; padding: 10px; position: relative">
          <div style="position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: #FFFFFF">
            <sc-if value="{{ c.hasCover }}" hint-placeholder-val="{{ true }}">
              <img class="zoom" src="{{ c.cover }}" alt="{{ c.coverAlt }}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block">
            </sc-if>
            <sc-if value="{{ c.noCover }}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; inset: 0; display: grid; place-items: center; border: 2px dashed #E7A9AE; border-radius: 10px; color: #7A5A5E; font-size: 12px; text-align: center; padding: 12px">Cover image slot (4:3)</div>
            </sc-if>
            <span style="position: absolute; top: 10px; left: 10px; background: #FFFFFF; color: #B0252C; border-radius: 999px; padding: 4px 11px; font-size: 11px; font-weight: 700">{{ c.cls }}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 6px 6px; flex: 1">
            <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7A5A5E">
              <span>{{ c.cat }}</span>
              <span style="text-transform: none; letter-spacing: 0; font-weight: 600; background: #FFFFFF; color: #3A2326; border-radius: 999px; padding: 3px 9px">{{ c.status }}</span>
            </div>
            <h3 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: #B0252C">{{ c.title }}</h3>
            <p style="margin: 0; font-size: 13px; line-height: 1.5">{{ c.desc }}</p>
            <button class="obtn" onClick="{{ c.open }}" aria-label="{{ c.aria }}" style="margin-top: auto; align-self: stretch; min-height: 44px; border: 1.5px solid #D1323A; border-radius: 10px; background: #FFFFFF; color: #B0252C; font-size: 13px; font-weight: 600">View Case Study</button>
          </div>
        </article>
      </sc-for>
    </div>
  </sc-if>

  
  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
    <div class="fade" ref="{{ viewerRef }}" role="region" aria-label="{{ cs.title }} case study" style="background: #FCEDEE; border-radius: 18px; padding: 12px; scroll-margin-top: 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 2px 2px 14px">
        <button class="obtn" onClick="{{ close }}" style="min-height: 44px; padding: 0 18px; border: 1.5px solid #D1323A; border-radius: 10px; background: #FFFFFF; color: #B0252C; font-size: 13px; font-weight: 600">← All projects</button>
        <div style="display: flex; gap: 6px; flex-wrap: wrap" aria-label="Switch project">
          <sc-for list="{{ switcher }}" as="w" hint-placeholder-count="4">
            <sc-if value="{{ w.cur }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ w.open }}" aria-current="true" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: #D1323A; color: #FFFFFF; font-size: 12px; font-weight: 600">{{ w.title }}</button>
            </sc-if>
            <sc-if value="{{ w.notCur }}" hint-placeholder-val="{{ true }}">
              <button class="wbtn" onClick="{{ w.open }}" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #B0252C; font-size: 12px; font-weight: 600">{{ w.title }}</button>
            </sc-if>
          </sc-for>
        </div>
      </div>

      <div style="background: #FFFFFF; border-radius: 14px; padding: 24px 26px">
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span style="border: 1.5px solid #D1323A; border-radius: 999px; padding: 3px 11px; font-size: 11.5px; font-weight: 600; color: #B0252C">{{ cs.cls }}</span>
          <span style="background: #FCEDEE; border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 600; color: #B0252C">{{ cs.cat }}</span>
          <span style="background: #F7F4F4; border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 600">{{ cs.status }}</span>
        </div>
        <h3 class="cs-title" style="margin: 12px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; color: #D1323A">{{ cs.title }}</h3>
        <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; max-width: 760px">{{ cs.desc }}</p>
      </div>

      <div class="sum" style="margin-top: 10px">
        <sc-for list="{{ cs.blocks }}" as="b" hint-placeholder-count="5">
          <div class="{{ b.cls }}" style="background: #FFFFFF; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px">
            <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B0252C">{{ b.num }}  {{ b.label }}</div>
            <sc-if value="{{ b.hasText }}" hint-placeholder-val="{{ true }}">
              <p style="margin: 0; font-size: 13.5px; line-height: 1.6">{{ b.text }}</p>
            </sc-if>
            <sc-if value="{{ b.hasItems }}" hint-placeholder-val="{{ false }}">
              <ul style="margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.55; display: flex; flex-direction: column; gap: 5px">
                <sc-for list="{{ b.items }}" as="it" hint-placeholder-count="3"><li>{{ it.t }}</li></sc-for>
              </ul>
            </sc-if>
            <sc-if value="{{ b.isDraft }}" hint-placeholder-val="{{ false }}">
              <div style="border: 2px dashed #E7A9AE; border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #7A5A5E; line-height: 1.45">{{ b.draft }}</div>
            </sc-if>
            <sc-if value="{{ b.hasLinks }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px">
                <sc-for list="{{ b.links }}" as="lk" hint-placeholder-count="2">
                  <button class="chip" onClick="{{ lk.go }}" style="min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: #FCEDEE; color: #B0252C; font-size: 11.5px; font-weight: 600">{{ lk.label }}</button>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ cs.hasClaims }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top: 10px; background: #FFFFFF; border-left: 0; border-radius: 14px; padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start">
          <span style="flex-shrink: 0; background: #FCEDEE; color: #B0252C; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700">Claims</span>
          <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #3A2326">{{ cs.claims }}</p>
        </div>
      </sc-if>

      <sc-if value="{{ cs.hasSkills }}" hint-placeholder-val="{{ true }}">
        <div style="margin-top: 10px; background: #FFFFFF; border-radius: 14px; padding: 16px 20px">
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B0252C; margin-bottom: 8px">Skills shown in this project</div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{ cs.skills }}" as="sk" hint-placeholder-count="4">
              <button class="chip" onClick="{{ sk.go }}" style="min-height: 34px; padding: 0 12px; border: 0; border-radius: 999px; background: #FCEDEE; color: #3A2326; font-size: 12px; font-weight: 600">{{ sk.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ cs.hasPhotos }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top: 10px">
          <h4 style="margin: 10px 4px 10px; font-size: 18px; font-weight: 700; color: #D1323A">Development in progress</h4>
          <div class="photos">
            <sc-for list="{{ cs.photos }}" as="ph" hint-placeholder-count="3">
              <figure style="margin: 0; background: #FFFFFF; border-radius: 12px; padding: 8px">
                <sc-if value="{{ ph.isSlot }}" hint-placeholder-val="{{ false }}">
                  <div style="aspect-ratio: 4 / 5; border: 2px dashed #E7A9AE; border-radius: 8px; display: grid; place-items: center; text-align: center; padding: 10px; font-size: 11.5px; color: #7A5A5E">{{ ph.caption }}</div>
                </sc-if>
                <sc-if value="{{ ph.isImg }}" hint-placeholder-val="{{ true }}">
                  <img src="{{ ph.src }}" alt="{{ ph.alt }}" loading="lazy" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 8px; display: block">
                  <figcaption style="font-size: 11.5px; padding: 6px 4px 2px; color: #7A5A5E">{{ ph.caption }}</figcaption>
                </sc-if>
              </figure>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ cs.hasDeck }}" hint-placeholder-val="{{ true }}">
        <div ref="{{ deckRef }}" style="margin-top: 16px; scroll-margin-top: 16px">
          <h4 style="margin: 6px 4px 10px; font-size: 18px; font-weight: 700; color: #D1323A">Full deck <span style="font-size: 13px; font-weight: 500; color: #7A5A5E">· {{ cs.n }} slides</span></h4>
          <div class="viewer">
            <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
              <div class="stage" tabIndex="0" onKeyDown="{{ v.onKey }}" aria-label="Slide viewer. Use the left and right arrow keys to change slides." style="position: relative; height: 580px; background: #FBE4E5; border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 24px 74px">
                <span aria-live="polite" style="position: absolute; top: 14px; left: 14px; font-size: 12px; font-weight: 700; background: #FFFFFF; border-radius: 999px; padding: 5px 12px; color: #B0252C">{{ v.counter }}</span>
                <img src="{{ v.src }}" alt="{{ v.alt }}" style="max-width: 100%; max-height: 100%; border-radius: 10px; background: #FFFFFF; box-shadow: 0 30px 60px -30px rgba(120,30,40,0.55), 0 2px 10px rgba(120,30,40,0.08); display: block">
                <button class="arrow prev" onClick="{{ v.prev }}" aria-label="Previous slide" disabled="{{ v.atStart }}" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0; background: #FFFFFF; color: #B0252C; display: grid; place-items: center; box-shadow: 0 8px 20px -10px rgba(196,45,50,0.6)">
                  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>

    var skillNames = SKILLS.map(function(n){ return { name: n }; });
    var videoRows = VIDEOS.map(function(vd){
      return { project: vd.project, cat: vd.cat, src: vd.src, poster: vd.poster, ratio: vd.ratio, desc: vd.desc,
               cls: vd.ratio === "9 / 16" ? "vv-tall" : "vv-wide", label: "Video: " + vd.project };
    });
    var wp = WORK_PHOTOS.filter(function(ph){ return !!ph.src; });
    var workPhotos = wp.map(function(ph, k){
      return { src: ph.src, alt: ph.alt, caption: ph.caption, openLabel: "Open photo: " + ph.caption, open: function(){ self.setState({ lb: k }); } };
    });
    var lbi = st.lb, lb = { open: lbi !== null && lbi < wp.length };
    if (lb.open) {
      var cur = wp[lbi], n = wp.length;
      var go = function(d){ self.setState({ lb: (lbi + d + n) % n }); };
      lb.src = cur.src; lb.alt = cur.alt; lb.caption = cur.caption; lb.counter = (lbi + 1) + " / " + n;
      lb.prev = function(e){ if (e) e.stopPropagation(); go(-1); };
      lb.next = function(e){ if (e) e.stopPropagation(); go(1); };
      lb.close = function(e){ if (e) e.stopPropagation(); self.setState({ lb: null }); };
      lb.backdrop = function(e){ if (e && e.target === e.currentTarget) self.setState({ lb: null }); };
      lb.onKey = function(e){
        if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
        else if (e.key === "Escape") { e.preventDefault(); self.setState({ lb: null }); }
      };
    }

    return {
      hero: hero, cards: cards, workRef: this.workRef, viewerRef: this.viewerRef, deckRef: this.deckRef,
      gridVisible: !p, isOpen: !!p, cs: cs, v: v, switcher: switcher,
      close: function(){ self.setState({ open: null, playing: null }, function(){ self.scrollTo(self.workRef); }); },
      steps: steps, skillNames: skillNames, videoRows: videoRows, workPhotos: workPhotos, lb: lb,
      copyLabel: st.copied ? "Copied" : "Copy email",
      copyEmail: function(){
        try {
          navigator.clipboard.writeText("mahasalsubaie@gmail.com").then(function(){ self.setState({ copied: true }); }, function(){});
        } catch (e) {}
      }
    };
  }
}

window.mountPage(Component, document.getElementById("tpl"), document.getElementById("app"));
})();
</script>
